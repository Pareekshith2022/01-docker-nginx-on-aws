services:

  db:
    image: mariadb:latest
    container_name: database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Snehapareekshith@2026
      MYSQL_USER: snehapo
      MYSQL_DATABASE: snehapo
      MYSQL_PASSWORD: Snehapareekshith@2026
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:latest
    container_name: wordpress-website
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_NAME: snehapo
      WORDPRESS_DB_USER: snehapo
      WORDPRESS_DB_PASSWORD: Snehapareekshith@2026
      WORDPRESS_DB_HOST: db:3306
    volumes:
      - web-data:/var/www/html

volumes:
  db_data:
  web-data:
